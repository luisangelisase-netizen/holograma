<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Holograma Corrigido</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#050816,#000);
    overflow:hidden;
}

/* palco */
.stage{
    position:relative;
    width:400px;
    height:600px;
}

/* glow */
.stage::before{
    
}

/* imagem holográfica */
.stage img{
    position:absolute;
    bottom:0;
    left:50%;
    right: 100  ;
    transform:translateX(-50%);
    height:550px;
    width:auto;

    opacity:0.9;

    filter:
        brightness(1.4)
        contrast(1.2)
        saturate(1.5)
        drop-shadow(0 0 20px #111111)
        
drop-shadow(0 0 40px #131212);
    mix-blend-mode:screen;
    animation:float 3s ease-in-out infinite;
}

/* scanlines */
.scan{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
        transparent,
        transparent 3px,
        rgba(0,255,255,0.05) 4px
    );
    pointer-events:none;
}

/* flutuar */
@keyframes float{
    50%{
        transform:translateX(-50%) translateY(-15px);
    }
}
.Nome{
    text-align: center;
    align-content:last baseline
}
</style>
</head>

<body>

<div class="stage">

<div class="Nome">
<h1><p style="color: #eeecec;"><i><strong>cursed blood</strong></i></p></h1>
</div>
<br>
    <img src="curesed2.webp">

    <div class="scan"></div>

</div>

</body>
</html>
